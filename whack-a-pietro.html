:root{
  --ink:#000;
  --tomato:#e23d2b;
  --leaf:#62b02a;
  --leaf-dk:#1e5a0a;
  --leaf-lt:#aede30;
  --sun:#ffd23f;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100svh;
  font-family:"Lilita One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  color:var(--ink);
  /* nonna's tablecloth */
  background-color:#fff7ec;
  background-image:
    linear-gradient(rgba(226,61,43,.2) 50%,transparent 50%),
    linear-gradient(90deg,rgba(226,61,43,.2) 50%,transparent 50%);
  background-size:72px 72px;
  -webkit-tap-highlight-color:transparent;
}
main{
  max-width:780px;margin:0 auto;
  padding:clamp(10px,2.4vw,24px) 14px 22px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
h1{
  margin:0;font-weight:400;text-align:center;line-height:1;letter-spacing:.01em;
  font-size:clamp(1.8rem,8vw,3.7rem);
  color:var(--tomato);
  -webkit-text-stroke:.11em var(--ink);paint-order:stroke fill;
  text-shadow:0 .07em 0 var(--ink);
}
.tag{margin:0;font-size:clamp(1.05rem,3.4vw,1.35rem);text-align:center}

/* ---------- HUD ---------- */
.hud{width:min(100%,720px);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:stretch}
.chip{
  background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);
  padding:7px 12px 4px;min-width:5rem;text-align:center;line-height:1;
}
.chip small{display:block;font-size:.85rem;margin-bottom:2px}
.chip b{display:block;font-weight:400;font-size:1.9rem}
.chip.bump b{animation:bump .25s ease-out}
.chip.bad b{animation:bad .5s ease-out}
@keyframes bump{50%{transform:scale(1.25)}}
@keyframes bad{0%,70%{color:var(--tomato)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{color:inherit}}
.timer{justify-content:center;display:flex;flex-direction:column;gap:5px;padding-inline:14px}
.timer .row{display:flex;justify-content:space-between;align-items:baseline}
.timer .row b{font-size:1.9rem;display:inline}
.bar{height:15px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--leaf);transform-origin:left center}
.timer.low .bar i{background:var(--tomato)}
.timer.low .row b{color:var(--tomato)}

/* ---------- board ---------- */
.board{
  position:relative;
  width:min(100%,720px,calc((100vh - 200px)*204/246));
  width:min(100%,720px,calc((100svh - 200px)*204/246));
  min-width:min(100%,290px);
  aspect-ratio:204/246;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
.board.playing{cursor:none}
#stage{display:block;width:100%;height:100%;overflow:visible}
.board.shake #stage{animation:shake .16s linear}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}

.fx-burst .in{transform-box:fill-box;transform-origin:center;animation:burst .75s ease-out forwards}
@keyframes burst{
  0%{transform:scale(.2) rotate(-14deg);opacity:0}
  22%{transform:scale(1.12) rotate(4deg);opacity:1}
  70%{transform:scale(1) rotate(0);opacity:1}
  100%{transform:scale(1.05);opacity:0}
}
.fx-word{font-family:"Lilita One",sans-serif;font-size:6.2px;text-anchor:middle;fill:#000}
.fx-score{
  font-family:"Lilita One",sans-serif;font-size:9px;text-anchor:middle;
  stroke:#000;stroke-width:2px;stroke-linejoin:round;paint-order:stroke fill;
  animation:floaty .95s ease-out forwards;
}
.fx-score.good{fill:var(--leaf-lt)}
.fx-score.bad{fill:#ff8f8f}
@keyframes floaty{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-16px);opacity:0}}

.fxlayer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:6}

/* ---------- weapon ---------- */
.weapon{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .15s}
.weapon.on{opacity:1}
.weapon .rot{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(-26deg)}
.weapon .art{position:absolute;left:0;top:0;transform:translate(-50%,calc(var(--ay)*-100%))}
.weapon .art svg{display:block;width:100%;height:auto;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.28))}
.art-spoon{width:clamp(44px,8vmin,66px);--ay:.17}
.art-slipper{width:clamp(62px,11vmin,90px);--ay:.4}
.weapon[data-w="spoon"] .art-slipper,.weapon[data-w="slipper"] .art-spoon{display:none}

/* ---------- overlay + cards ---------- */
.overlay{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:12px;
  background:rgba(255,247,236,.55);
}
.card{
  width:min(100%,440px);max-height:calc(100vh - 24px);max-height:calc(100svh - 24px);overflow:auto;
  background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);
  padding:clamp(14px,3.4vw,22px);
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
}
.card h2{margin:0;font-weight:400;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1}
.card p{margin:0;font-size:1.15rem;line-height:1.25}

.btn{
  font:inherit;font-size:1.3rem;line-height:1.1;color:var(--ink);
  background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);
  padding:.5rem 1.1rem .4rem;cursor:pointer;
  transition:transform .06s,box-shadow .06s,background-color .1s;
}
.btn:hover{background:var(--leaf-lt)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--tomato);color:#fff;font-size:1.55rem;padding-inline:1.5rem}
.btn.primary:hover{background:#f0553f}
.btn[disabled]{opacity:.6;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
:focus-visible{outline:4px solid var(--leaf-dk);outline-offset:3px}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;border:0;margin:0;padding:0}
.opts legend{position:absolute;opacity:0}
.opt{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;
  padding:8px 4px 7px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;
  font-size:1rem;line-height:1.05;box-shadow:3px 3px 0 var(--ink);
  transition:transform .06s,box-shadow .06s,background-color .1s;
}
.opt input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.opt svg{height:84px;width:auto;display:block}
.opt:has(input:checked){background:var(--leaf-lt);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt:has(input:focus-visible){outline:4px solid var(--leaf-dk);outline-offset:3px}

.levels{margin-top:-2px}
.opt.lvl{padding:8px 4px 6px;font-size:1.2rem;justify-content:center}
.legend{display:flex;gap:22px;align-items:center;justify-content:center;font-size:1.3rem}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend img{
  width:46px;height:46px;object-fit:cover;object-position:50% 6%;
  border:3px solid var(--ink);border-radius:50%;background:var(--leaf-lt);
}
.plus{color:var(--leaf-dk)}
.minus{color:var(--tomato)}

.final{font-size:4rem;line-height:.9;color:var(--tomato);-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:0 .05em 0 var(--ink)}
.stats{display:grid;gap:2px}
.field{display:grid;gap:5px;width:100%;text-align:left;font-size:1.05rem}
.field input{
  font:inherit;font-size:1.35rem;padding:.4rem .75rem .3rem;color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;background:#fffdf7;width:100%;
}
.rank{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:3px;font-size:1.15rem;text-align:left}
.rank li{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:8px;align-items:center;padding:3px 10px 1px;border:3px solid transparent;border-radius:10px}
.rank li:nth-child(odd){background:#f1f6e4}
.rank li.me{border-color:var(--ink);background:var(--sun)}
.rank .pos{opacity:.55}
.rank li.me .pos{opacity:1}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .lv{font-size:.8rem;line-height:1;padding:3px 7px 1px;border:2px solid var(--ink);border-radius:99px;background:var(--leaf-lt)}
.rank .lv.medium{background:var(--sun)}
.rank .lv.hard{background:#ff9a8a}
.rank .gap{display:block;text-align:center;opacity:.5;padding:0;border:0;background:none;line-height:.7}
.note{font-size:1.1rem}

/* ---------- misc ---------- */
.mute{
  position:fixed;top:10px;right:10px;z-index:40;width:46px;height:46px;padding:0;display:grid;place-items:center;
  background:#fff;border:3px solid var(--ink);border-radius:50%;box-shadow:3px 3px 0 var(--ink);cursor:pointer;
}
.mute:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mute svg{width:26px;height:26px}
.foot,.back{margin:2px 0 0;font-size:1.05rem}
.foot a,.back{color:var(--ink);text-decoration-thickness:3px;text-underline-offset:3px}
.foot a:hover,.back:hover{color:var(--tomato)}

@media (min-width:860px) and (orientation:landscape){
  main{
    max-width:none;min-height:100vh;min-height:100svh;padding:20px 28px;
    display:grid;justify-content:center;align-content:center;align-items:start;
    grid-template-columns:minmax(290px,330px) auto;
    grid-template-rows:auto auto 1fr;
    grid-template-areas:"head board" "hud board" "foot board";
    column-gap:40px;row-gap:16px;
  }
  .head{grid-area:head}
  .head h1{text-align:left;font-size:clamp(2rem,3.1vw,2.5rem);white-space:nowrap}
  .tag{text-align:left;margin-top:10px}
  .hud{grid-area:hud;width:100%;grid-template-columns:1fr 1fr;grid-template-areas:"time time" "score best"}
  .timer{grid-area:time}
  #chip-score{grid-area:score}
  #chip-best{grid-area:best}
  .board{grid-area:board;width:min(720px,calc((100vh - 40px)*204/246));width:min(720px,calc((100svh - 40px)*204/246));}
  .foot{grid-area:foot;align-self:end;margin:0}
}
@media (max-width:440px){
  .hud{gap:7px}
  .chip{min-width:4.2rem;padding-inline:8px}
  .chip b,.timer .row b{font-size:1.6rem}
  .opt svg{height:70px}
  .legend{gap:14px;font-size:1.15rem}
  .final{font-size:3.4rem}
}
@media (prefers-reduced-motion:reduce){
  .board.shake #stage{animation:none}
  .chip.bump b,.chip.bad b{animation:none}
  .fx-burst .in{animation:none}
  .fx-score{animation:none;opacity:1}
}

const STORE_KEY = 'whackAPietro.scores.v1';
let memoryScores = [];
function readStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
  catch { return memoryScores; }
}
function writeStore(rows){
  memoryScores = rows;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(rows)); } catch {}
}
const byScore = (a,b) => b.score - a.score || a.date - b.date;
async function getTopScores(limit = 10){
  return readStore().slice().sort(byScore).slice(0, limit);
}
async function saveScore(name, score, level){
  const entry = {id: Math.random().toString(36).slice(2), name: (name||'').trim().slice(0,20) || 'Anonymous', score, level: level || 'easy', date: Date.now()};
  const rows = readStore(); rows.push(entry);
  rows.sort(byScore);
  writeStore(rows.slice(0, 200));
  entry.rank = rows.findIndex(r => r.id === entry.id) + 1;
  return entry;
}

/* ================= helpers ================= */
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const svg = $('#stage'), board = $('#board'), fx = $('#fx'), defs = $('#defs');
const weaponEl = $('#weapon'), rotEl = $('#rot');
const el = (name, attrs, parent) => {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const rnd = (a,b) => a + Math.random()*(b-a);
const lerp = (a,b,t) => a + (b-a)*t;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const easeOutBack = t => { const c1 = 1.5, c3 = c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const easeOutQuad = t => 1 - (1-t)*(1-t);

document.querySelectorAll('img[data-sprite]').forEach(i => i.src = SPRITES[i.dataset.sprite]);

/* ================= sound (tiny synth, no files) ================= */
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('whackAPietro.muted') === '1'; } catch {}
  function ensure(){
    if (muted) return null;
    try {
      if (!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate*.4, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  }
  function env(g, t, peak, attack, dur){
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(peak, t+attack);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  }
  function noise(c, t, dur, freq, type, peak){
    const s = c.createBufferSource(); s.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain(); env(g, t, peak, .004, dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()*.1, dur+.02);
  }
  function tone(c, t, type, f0, f1, dur, peak, vib){
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = c.createGain(); env(g, t, peak, .01, dur);
    if (vib){
      const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = vib[0]; lg.gain.value = vib[1];
      l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+dur+.05);
    }
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }
  return {
    get muted(){ return muted; },
    set muted(v){ muted = v; try { localStorage.setItem('whackAPietro.muted', v?'1':'0'); } catch {} },
    unlock(){ ensure(); },
    whoosh(){ const c = ensure(); if(!c) return; noise(c, c.currentTime, .09, 1800, 'bandpass', .12); },
    whack(){ const c = ensure(); if(!c) return; const t = c.currentTime;
      noise(c, t, .07, 2400, 'lowpass', .5); tone(c, t, 'sine', 170, 55, .14, .7); },
    ouch(){ const c = ensure(); if(!c) return; const t = c.currentTime + .03;
      tone(c, t, 'triangle', 620, 300, .26, .38, [22, 25]); },
    bleat(){ const c = ensure(); if(!c) return; const t = c.currentTime + .03;
      const o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(430, t); o.frequency.exponentialRampToValueAtTime(290, t+.55);
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1150; f.Q.value = 2.5;
      const g = c.createGain(); env(g, t, .42, .05, .6);
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 30; lg.gain.value = .22;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t); lfo.start(t); o.stop(t+.65); lfo.stop(t+.65); },
    over(good){ const c = ensure(); if(!c) return; const t = c.currentTime;
      const notes = good ? [523,659,784,1047] : [392,330,262];
      notes.forEach((f,i) => tone(c, t+i*.16, 'square', f, f*.995, .22, .16)); },
  };
})();
const muteBtn = $('#mute');
function paintMute(){
  muteBtn.setAttribute('aria-pressed', Sound.muted);
  muteBtn.setAttribute('aria-label', Sound.muted ? 'Sound off' : 'Sound on');
  $('#mute-on').hidden = Sound.muted; $('#mute-off').hidden = !Sound.muted;
}
muteBtn.addEventListener('click', () => { Sound.muted = !Sound.muted; paintMute(); if(!Sound.muted) Sound.whack(); });
paintMute();

/* ================= game state ================= */
const G = {level:'easy', state:'menu', timeLeft:ROUND_SECONDS, score:0, best:0, pietroSpawned:0, pietroHit:0, goatHit:0, misses:0,
           nextSpawn:0, clock:0, lastSlot:-1, goatStreak:0};
let weaponChoice = 'spoon', weaponNow = 'spoon', levelChoice = 'easy';
try { weaponChoice = localStorage.getItem('whackAPietro.weapon') || 'spoon'; } catch {}
if (!['spoon','slipper','random'].includes(weaponChoice)) weaponChoice = 'spoon';
try { levelChoice = localStorage.getItem('whackAPietro.level') || 'easy'; } catch {}
if (!LEVELS[levelChoice]) levelChoice = 'easy';
document.querySelector(`input[name=level][value=${levelChoice}]`).checked = true;
document.querySelector(`input[name=weapon][value=${weaponChoice}]`).checked = true;

const T_RISE = 170, T_SINK = 200, T_HIT = 560;

/* ================= holes / moles ================= */
const moles = HOLES.map((h,k) => {
  const slot = svg.querySelector(`[data-slot="${k}"]`);
  const R = h.h/2 - .4, hw = h.w/2 - .4, B = 600;
  // the character is only visible above the floret's upper outline: it climbs out from behind it
  const cp = el('clipPath', {id:`clip-${k}`}, defs);
  el('polygon', {points:[[h.cx-B,h.cy-B],[h.cx+B,h.cy-B],[h.cx+B,h.cy-R/2],[h.cx+hw,h.cy-R/2],[h.cx,h.cy-R],[h.cx-hw,h.cy-R/2],[h.cx-B,h.cy-R/2]].map(p=>p.join(',')).join(' ')}, cp);
  slot.setAttribute('clip-path', `url(#clip-${k})`);
  slot.style.display = 'none';
  const mover = el('g', {}, slot);
  const img = el('image', {preserveAspectRatio:'none'}, mover);
  const m = {k, h, R, slot, mover, img, phase:'idle', kind:null, t:0, upFor:0, d:null};
  slot.addEventListener('pointerdown', e => smash(m, e));
  return m;
});

function setKind(m, kind){
  const K = KINDS[kind], W = K.scale*m.h.w, H = W*K.aspect;
  const upTop = m.h.cy - m.R - K.headFrac*H;
  const parked = m.h.cy - m.R/2 + 1.5;
  m.kind = kind;
  m.d = {W, H, upTop, travel: parked - upTop, yb: upTop + .55*H};
  const a = m.img;
  a.setAttribute('x', m.h.cx - W/2); a.setAttribute('y', upTop);
  a.setAttribute('width', W); a.setAttribute('height', H);
  setPose(m, 'ok');
}
function setPose(m, pose){ m.img.setAttribute('href', KINDS[m.kind][pose]); }

function spawn(m, kind, upFor){
  setKind(m, kind);
  m.phase = 'rise'; m.t = 0; m.upFor = upFor;
  m.slot.style.display = '';
  m.slot.dataset.phase = 'rise'; m.slot.dataset.kind = kind;
  apply(m, 0, 1, 1);
  if (kind === 'pietro') G.pietroSpawned++;
}
function park(m){
  m.phase = 'idle'; m.slot.style.display = 'none'; m.slot.dataset.phase = 'idle';
}
function apply(m, p, sx, sy){
  const dy = ((1-p)*m.d.travel).toFixed(2);
  m.mover.setAttribute('transform', (sx === 1 && sy === 1)
    ? `translate(0 ${dy})`
    : `translate(0 ${dy}) translate(${m.h.cx} ${m.d.yb}) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(${-m.h.cx} ${-m.d.yb})`);
}
function stepMole(m, dt){
  if (m.phase === 'idle') return;
  m.t += dt;
  let p = 1, sx = 1, sy = 1;
  if (m.phase === 'rise'){
    const u = Math.min(1, m.t/T_RISE); p = easeOutBack(u);
    if (u >= 1){ m.phase = 'up'; m.t = 0; m.slot.dataset.phase = 'up'; }
  } else if (m.phase === 'up'){
    if (m.t >= m.upFor){ m.phase = 'sink'; m.t = 0; m.slot.dataset.phase = 'sink'; }
  } else if (m.phase === 'sink'){
    const u = Math.min(1, m.t/T_SINK); p = 1 - u*u;
    if (u >= 1){ park(m); return; }
  } else if (m.phase === 'hit'){
    const q = easeOutQuad(Math.min(1, m.t/110));
    sx = 1 + .18*q; sy = 1 - .42*q;
    if (m.t > 340){ const u = Math.min(1, (m.t-340)/(T_HIT-340)); p = 1 - u*u; }
    if (m.t >= T_HIT){ park(m); return; }
  }
  apply(m, p, sx, sy);
}

/* ================= hits and effects ================= */
function toSvg(e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function burst(p, word, fill){
  const g = el('g', {class:'fx-burst', transform:`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`}, fx);
  const inner = el('g', {class:'in'}, g);
  const pts = []; const n = 14;
  for (let i=0;i<n*2;i++){ const a = Math.PI*i/n + rnd(-.04,.04), r = (i%2 ? 9 : 15.5) * rnd(.9,1.1); pts.push((Math.cos(a)*r).toFixed(1)+','+(Math.sin(a)*r*.82).toFixed(1)); }
  el('polygon', {points:pts.join(' '), fill, stroke:'#000', 'stroke-width':'1.1', 'stroke-linejoin':'round'}, inner);
  const t = el('text', {class:'fx-word', y:'2.2'}, inner); t.textContent = word;
  setTimeout(() => g.remove(), 800);
}
function floatText(x, y, text, cls){
  const t = el('text', {class:`fx-score ${cls}`, x:x.toFixed(1), y:y.toFixed(1)}, fx);
  t.textContent = text; setTimeout(() => t.remove(), 1000);
}
const scoreEl = $('#score'), chipScore = $('#chip-score');
function flash(cls){ chipScore.classList.remove('bump','bad'); void chipScore.offsetWidth; chipScore.classList.add(cls); }
function shake(){ board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake'); }

function smash(m, e){
  if (G.state !== 'playing') return;
  if (!(m.phase === 'rise' || m.phase === 'up' || m.phase === 'sink')) return;
  e.__hit = true;
  const p = toSvg(e);
  m.phase = 'hit'; m.t = 0; m.slot.dataset.phase = 'hit';
  setPose(m, 'hit');
  if (m.kind === 'pietro'){
    G.score += POINTS_PIETRO; G.pietroHit++; G.goatStreak = 0;
    Sound.ouch(); burst(p, pick(WORDS_PIETRO), '#ffd23f');
    floatText(p.x, p.y - 17, '+' + POINTS_PIETRO, 'good'); flash('bump');
  } else {
    G.score = Math.max(0, G.score - PENALTY_GOAT); G.goatHit++;
    Sound.bleat(); burst(p, pick(WORDS_GOAT), '#ffb3c7');
    floatText(p.x, p.y - 17, '−' + PENALTY_GOAT, 'bad'); flash('bad'); shake();
  }
  scoreEl.textContent = G.score;
}

/* ================= weapon ================= */
function chooseWeaponForSwing(){
  weaponNow = weaponChoice === 'random' ? pick(['spoon','slipper']) : weaponChoice;
  weaponEl.dataset.w = weaponNow;
}
function placeWeapon(e){
  const r = board.getBoundingClientRect();
  weaponEl.style.transform = `translate(${(e.clientX - r.left).toFixed(1)}px,${(e.clientY - r.top).toFixed(1)}px)`;
}
let hideTimer = 0;
board.addEventListener('pointermove', e => {
  if (G.state !== 'playing' || e.pointerType === 'touch') return;
  placeWeapon(e); weaponEl.classList.add('on');
});
board.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') weaponEl.classList.remove('on'); });
board.addEventListener('pointerdown', e => {
  if (G.state !== 'playing') return;
  Sound.unlock();
  placeWeapon(e); weaponEl.classList.add('on');
  rotEl.animate([
    {transform:'translate(0px,0px) rotate(-26deg) scale(1)'},
    {transform:'translate(0px,0px) rotate(20deg) scale(.9)', offset:.2},
    {transform:'translate(48px,-38px) rotate(-52deg) scale(1)', offset:.5},
    {transform:'translate(0px,0px) rotate(-26deg) scale(1)'}
  ], {duration:420, easing:'ease-out'});
  Sound.whack();
  if (!e.__hit){ G.misses++; }
  if (e.pointerType === 'touch'){
    clearTimeout(hideTimer); hideTimer = setTimeout(() => weaponEl.classList.remove('on'), 380);
  }
  setTimeout(chooseWeaponForSwing, 120);   // "Surprise me": next swing may use the other weapon
});

/* ================= spawning ================= */
function difficulty(){ return 1 - G.timeLeft/ROUND_SECONDS; }
function liveCount(){ return moles.filter(m => m.phase === 'rise' || m.phase === 'up' || m.phase === 'hit').length; }
function trySpawn(){
  const d = difficulty();
  const L = LEVELS[G.level];
  const maxLive = L.live[0] + Math.floor(d*(L.live[1] - L.live[0] + .4));
  if (liveCount() >= maxLive) return false;
  const free = moles.filter(m => m.phase === 'idle' && m.k !== G.lastSlot);
  if (!free.length) return false;
  const m = pick(free);
  const pietroUp = moles.some(x => x.kind === 'pietro' && (x.phase === 'rise' || x.phase === 'up'));
  let kind = Math.random() < lerp(L.goat[0], L.goat[1], d) ? 'goat' : 'pietro';
  if (kind === 'goat' && (G.goatStreak >= 2 || (!pietroUp && G.goatStreak >= 1))) kind = 'pietro';
  G.goatStreak = kind === 'goat' ? G.goatStreak + 1 : 0;
  G.lastSlot = m.k;
  spawn(m, kind, lerp(L.up[0], L.up[1], d) * rnd(.85, 1.2));
  return true;
}

/* ================= rounds ================= */
const timeEl = $('#time'), barEl = $('#bar'), timerEl = $('#timer'), bestEl = $('#best');
function paintHud(){
  const s = Math.max(0, Math.ceil(G.timeLeft));
  timeEl.textContent = s;
  barEl.style.transform = `scaleX(${Math.max(0, G.timeLeft/ROUND_SECONDS)})`;
  timerEl.classList.toggle('low', G.timeLeft <= 10 && G.state === 'playing');
}
function startGame(){
  Sound.unlock();
  Object.assign(G, {level:levelChoice, state:'playing', timeLeft:ROUND_SECONDS, score:0, pietroSpawned:0, pietroHit:0, goatHit:0, misses:0, clock:0, nextSpawn:550, lastSlot:-1, goatStreak:0});
  moles.forEach(park);
  scoreEl.textContent = '0'; paintHud();
  showView(null);
  board.classList.add('playing');
  chooseWeaponForSwing();
}
function endGame(){
  G.state = 'over';
  timerEl.classList.remove('low');
  board.classList.remove('playing'); weaponEl.classList.remove('on');
  moles.forEach(m => { if (m.phase !== 'idle' && m.phase !== 'hit'){ m.phase = 'sink'; m.t = 0; } });
  const isBest = G.score > G.best && G.score > 0;
  if (isBest){ G.best = G.score; bestEl.textContent = G.best; try { localStorage.setItem('whackAPietro.best', String(G.best)); } catch {} }
  Sound.over(isBest);
  setTimeout(showOver, 650);
}
function showOver(){
  $('#final').textContent = G.score;
  const st = $('#stats'); st.textContent = '';
  const line = t => { const p = document.createElement('p'); p.textContent = t; st.appendChild(p); };
  line(`Level: ${LEVELS[G.level].label}`);
  line(`Pietros smashed: ${G.pietroHit} of ${G.pietroSpawned}`);
  line(G.goatHit === 0 ? 'Goats bonked: none. Well done.' : `Goats bonked: ${G.goatHit}`);
  let saved = ''; try { saved = localStorage.getItem('whackAPietro.name') || ''; } catch {}
  $('#name').value = saved;
  $('#btn-save').disabled = false;
  showView('over');
  if (!matchMedia('(pointer:coarse)').matches) $('#name').focus({preventScroll:true});
}

/* ================= views ================= */
const overlay = $('#overlay');
const views = {menu:$('#view-menu'), over:$('#view-over'), rank:$('#view-rank')};
function showView(name){
  overlay.hidden = !name;
  for (const k in views) views[k].hidden = (k !== name);
  if (name){
    const first = name === 'menu' ? $('#btn-start') : name === 'rank' ? $('#btn-again-2') : null;
    if (first) first.focus({preventScroll:true});
  }
}
document.querySelectorAll('input[name=weapon]').forEach(r => r.addEventListener('change', () => {
  weaponChoice = r.value; try { localStorage.setItem('whackAPietro.weapon', weaponChoice); } catch {}
}));
document.querySelectorAll('input[name=level]').forEach(r => r.addEventListener('change', () => {
  levelChoice = r.value; try { localStorage.setItem('whackAPietro.level', levelChoice); } catch {}
}));
$('#btn-start').addEventListener('click', startGame);
$('#btn-again-1').addEventListener('click', startGame);
$('#btn-again-2').addEventListener('click', startGame);
$('#btn-menu').addEventListener('click', () => showView('menu'));
$('#btn-rank').addEventListener('click', () => showRanking(null));

async function showRanking(highlight){
  showView('rank');
  const body = $('#rank-body'); body.textContent = '';
  const msg = t => { const p = document.createElement('p'); p.className = 'note'; p.textContent = t; body.replaceChildren(p); return p; };
  msg('Loading the ranking...');
  let rows;
  try { rows = await getTopScores(10); }
  catch {
    const p = msg('The ranking could not be loaded. Check your connection and try again.');
    const b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = 'Try again';
    b.addEventListener('click', () => showRanking(highlight)); body.appendChild(b); return;
  }
  if (!rows.length){ msg('No scores yet. Be the first to smash Pietro.'); return; }
  const ol = document.createElement('ol'); ol.className = 'rank';
  const row = (r, pos, mine) => {
    const li = document.createElement('li'); if (mine) li.className = 'me';
    const lvKey = LEVELS[r.level] ? r.level : 'easy';      // scores saved before levels existed count as Easy
    for (const [cls, txt] of [['pos', pos], ['nm', r.name], ['lv ' + lvKey, LEVELS[lvKey].label], ['sc', r.score]]){
      const s = document.createElement('span'); s.className = cls; s.textContent = txt; li.appendChild(s);
    }
    return li;
  };
  rows.forEach((r,i) => ol.appendChild(row(r, i+1, highlight && r.id === highlight.id)));
  if (highlight && !rows.some(r => r.id === highlight.id)){
    const gap = document.createElement('li'); gap.className = 'gap'; gap.textContent = '...'; ol.appendChild(gap);
    ol.appendChild(row(highlight, highlight.rank, true));
  }
  body.replaceChildren(ol);
}
$('#form-save').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#btn-save'); if (btn.disabled) return; btn.disabled = true;
  const name = $('#name').value;
  try { localStorage.setItem('whackAPietro.name', name.trim().slice(0,20)); } catch {}
  let entry = null;
  try { entry = await saveScore(name, G.score, G.level); } catch {}
  showRanking(entry);
});

/* ================= main loop ================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(100, now - last); last = now;      // a hidden tab simply pauses the game
  if (G.state === 'playing'){
    G.clock += dt; G.timeLeft -= dt/1000;
    if (G.timeLeft <= 0){ G.timeLeft = 0; paintHud(); endGame(); }
    else {
      paintHud();
      if (G.clock >= G.nextSpawn){
        const d = difficulty();
        const L = LEVELS[G.level];
        G.nextSpawn = trySpawn() ? G.clock + lerp(L.gap[0], L.gap[1], d) * rnd(.75, 1.25) : G.clock + 120;
      }
    }
  }
  for (const m of moles) stepMole(m, dt);
  requestAnimationFrame(frame);
}

/* ================= start ================= */
let storedBest = 0; try { storedBest = Number(localStorage.getItem('whackAPietro.best')) || 0; } catch {}
G.best = storedBest; bestEl.textContent = G.best;
getTopScores(1).then(r => { G.best = Math.max(storedBest, r[0] ? r[0].score : 0); bestEl.textContent = G.best; }).catch(() => {});
paintHud();
showView('menu');
requestAnimationFrame(frame);
})();
</script>
